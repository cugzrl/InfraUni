seed: 42
num_classes: 10
pc_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
voxel_size: [0.8, 0.8]
image_h: 256
image_w: 448
num_queries: 120
num_modes: 3
num_future: 6
traj_radius: 60.0
d_model: 128
nhead: 4
dropout: 0.0

data:
  dataroot: /home/kemove/devdata1/zrl/bevfusion/data/nuscenes
  version: v1.0-mini
  info_path: data/infos/nuscenes_mini.pkl

train:
  epochs: 24
  batch_size: 4
  workers: 4
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 5.0
  log_every: 20

loss:
  heatmap: 1.0
  cls: 1.0
  box: 0.5
  traj: 0.5
  mode: 0.2
  # lidar stage, camera stage, motion-feedback stage
  stage_weights: [0.5, 1.0, 1.0]

eval:
  dist_thresh: 2.0
  score_thresh: 0.15

out_dir: experiments/nuscenes_mini
