# Offline clone of the existing openpcdet env. Do not reinstall torch from the
# network on this machine: conda SSL to repo.anaconda.com is unreliable.
name: infrauni
channels:
  - conda-forge
dependencies:
  - python=3.8
  - pip
  - pip:
      - torch==2.1.0
      - torchvision==0.16.0
      - numpy==1.24.4
      - scipy==1.10.1
      - pyyaml
      - matplotlib
      - tqdm
      - opencv-python
